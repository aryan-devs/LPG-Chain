# ============================================================
# Isolated In-Memory H2 Database Configuration for Automated Tests
# Prevents tests from touching or altering the developer's local MySQL database (jdbc:mysql://localhost:3306/lpg_chain)
# ============================================================

spring.profiles.active=test

# H2 in-memory test database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:lpgchaintest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test Security Configuration (safe, test-only credentials)
jwt.secret=TestJwtSecretKeyForAutomatedSecurityTestingMustBeAtLeast256BitsLongForHmacSha256!
jwt.expiration=86400000
lpgchain.security.password-pepper=test-environment-pepper-secret-key-1234567890
password.pepper=test-environment-pepper-secret-key-1234567890

# Test Official Email Policy Configuration
lpgchain.email.distributor-domains=distributor.example,agency.example,approved-distributor.example,lpgchain.demo
lpgchain.email.admin-domains=lpgchain.example,admin.lpgchain.example,lpgchain.demo
