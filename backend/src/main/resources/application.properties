# ============================================================
# LPG-Chain — Backend Configuration (Development)
# ============================================================

# Server
server.port=8080

# Application name
spring.application.name=LPG-Chain

# -----------------------------------------------
# MySQL Database
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/lpg_chain
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=pass@123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lpgchain=DEBUG
