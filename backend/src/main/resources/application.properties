# ============================================================
# LPG-Chain — Backend Configuration
# ============================================================

# Active profile  (override with -Dspring.profiles.active=prod etc.)
spring.profiles.active=dev

# Server
server.port=8080

# Application name
spring.application.name=LPG-Chain

# -----------------------------------------------
# MySQL Database  — credentials via environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your shell or .env
# -----------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lpgchain=DEBUG

# --- JWT Configuration ---
# Resolved from OS environment variables (set before starting the app).
# PowerShell:  $env:JWT_SECRET = "your-secret-at-least-32-chars"
# System env:  set JWT_SECRET=your-secret-at-least-32-chars
#
# Production: always override JWT_SECRET with a real secret via environment variable.
# The fallback below is for LOCAL DEVELOPMENT ONLY — never use it in production.
jwt.secret=${JWT_SECRET:lpgchain-dev-only-secret-not-for-production-use}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Password Pepper Configuration ---
# Resolved from OS environment variable PASSWORD_PEPPER.
# Combined with raw passwords before BCrypt hashing for defense-in-depth.
# The fallback below is for LOCAL DEVELOPMENT ONLY — override with PASSWORD_PEPPER in production.
password.pepper=${PASSWORD_PEPPER:lpgchain-dev-pepper-secret-change-in-production-random-48c}

# --- Official Email Policy Configuration ---
# Configurable approved domains for distributors and administrators.
# Overridden in production via LPGCHAIN_DISTRIBUTOR_EMAIL_DOMAINS and LPGCHAIN_ADMIN_EMAIL_DOMAINS.
lpgchain.email.distributor-domains=${LPGCHAIN_DISTRIBUTOR_EMAIL_DOMAINS:distributor.example,agency.example,approved-distributor.example,lpgchain.demo}
lpgchain.email.admin-domains=${LPGCHAIN_ADMIN_EMAIL_DOMAINS:lpgchain.example,admin.lpgchain.example,lpgchain.demo}
