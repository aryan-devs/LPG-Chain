# ============================================================
# LPG-Chain — Backend Configuration
# ============================================================

# Active profile  (override with -Dspring.profiles.active=prod etc.)
spring.profiles.active=dev

# Server
server.port=8080

# Application name
spring.application.name=LPG-Chain

# -----------------------------------------------
# MySQL Database  — credentials via environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your shell or .env
# -----------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lpgchain=DEBUG
