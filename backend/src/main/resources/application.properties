# ============================================================
# LPG-Chain — Backend Configuration
# ============================================================

# Active profile  (override with -Dspring.profiles.active=prod etc.)
spring.profiles.active=dev

# Server port (configurable for multi-instance horizontal scaling)
server.port=${SERVER_PORT:8080}

# Application name
spring.application.name=LPG-Chain

# -----------------------------------------------
# MySQL Database  — credentials via environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your shell or .env
# -----------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lpgchain=DEBUG

# --- JWT Configuration ---
# Resolved from OS environment variables (set before starting the app).
# PowerShell:  $env:JWT_SECRET = "your-secret-at-least-32-chars"
# System env:  set JWT_SECRET=your-secret-at-least-32-chars
#
# Production: always override JWT_SECRET with a real secret via environment variable.
# The fallback below is for LOCAL DEVELOPMENT ONLY — never use it in production.
jwt.secret=${JWT_SECRET:lpgchain-dev-only-secret-not-for-production-use}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Password Pepper Configuration ---
# Resolved from OS environment variable PASSWORD_PEPPER.
# Combined with raw passwords before BCrypt hashing for defense-in-depth.
# The fallback below is for LOCAL DEVELOPMENT ONLY — override with PASSWORD_PEPPER in production.
password.pepper=${PASSWORD_PEPPER:lpgchain-dev-pepper-secret-change-in-production-random-48c}

# --- Official Email Policy Configuration ---
# Configurable approved domains for distributors and administrators.
# Overridden in production via LPGCHAIN_DISTRIBUTOR_EMAIL_DOMAINS and LPGCHAIN_ADMIN_EMAIL_DOMAINS.
lpgchain.email.distributor-domains=${LPGCHAIN_DISTRIBUTOR_EMAIL_DOMAINS:distributor.example,agency.example,approved-distributor.example,lpgchain.demo}
lpgchain.email.admin-domains=${LPGCHAIN_ADMIN_EMAIL_DOMAINS:lpgchain.example,admin.lpgchain.example,lpgchain.demo}

# --- Production Demo Accounts Provisioning ---
# Opt-in trigger for safe, one-time bootstrapping of demo Admin & Distributor in production.
# Controlled via PROVISION_DEMO_ACCOUNTS env var (defaults to false).
lpgchain.provision-demo-accounts=${PROVISION_DEMO_ACCOUNTS:false}

# --- Traccar GPS Integration Configuration ---
# Resolved from TRACCAR_BASE_URL (defaults to local Traccar server on port 8082)
traccar.base-url=${TRACCAR_BASE_URL:http://localhost:8082}
traccar.connect-timeout-millis=${TRACCAR_CONNECT_TIMEOUT:3000}
traccar.read-timeout-millis=${TRACCAR_READ_TIMEOUT:3000}
traccar.api-token=${TRACCAR_API_TOKEN:}

# --- Redis Real-Time Tracking & Pub/Sub Configuration ---
# Container-to-container communication uses REDIS_HOST=redis; local default is localhost
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:10000}
spring.data.redis.repositories.enabled=false

# Fast-changing temporary tracking state TTL (default 60 seconds)
lpgchain.redis.latest-location-ttl-seconds=${REDIS_LATEST_LOCATION_TTL_SECONDS:60}
# Redis Pub/Sub tracking channel
lpgchain.redis.tracking-channel=${REDIS_TRACKING_CHANNEL:lpgchain:tracking:vehicle-location}
# Background listener auto-startup
lpgchain.redis.listener-auto-startup=${REDIS_LISTENER_AUTO_STARTUP:true}
# Application instance identifier for multi-instance horizontal scaling
lpgchain.redis.instance-id=${INSTANCE_ID:lpg-chain-1}

# --- Delivery Handover Notification Provider Configuration ---
# Configurable SMS provider: "dev" (explicitly labelled test flow) or "twilio"
lpgchain.notification.provider=${LPGCHAIN_NOTIFICATION_PROVIDER:dev}
lpgchain.notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
lpgchain.notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
lpgchain.notification.twilio.from-number=${TWILIO_FROM_NUMBER:}

# --- Google OAuth 2.0 / OpenID Connect ---
google.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-id=${GOOGLE_CLIENT_ID:${google.client-id:}}

# --- Local Ollama AI Assistant ---
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

# --- ML Demand Forecasting Service (FastAPI) ---
lpgchain.ml.forecast-url=${ML_FORECAST_URL:http://localhost:8000/forecast}

# --- KYC Document Storage ---
lpgchain.documents.upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/documents}

# --- Multipart Upload File Limits (Prevent HTTP 500 on large KYC uploads) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# --- Optional Razorpay Test Mode Configuration ---
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# --- Customer Support Configuration ---
# Configurable customer support phone number. If empty, the assistant uses the unconfigured support fallback message.
lpgchain.support.phone=${LPGCHAIN_SUPPORT_PHONE:1800-233-3555}
