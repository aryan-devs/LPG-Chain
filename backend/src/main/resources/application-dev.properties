# ============================================================
# LPG-Chain — Development Profile (application-dev.properties)
# Activated by: spring.profiles.active=dev
#
# DO NOT put real passwords in this file.
# Set DB_PASSWORD as an environment variable or in a local .env file.
# ============================================================

# --- Database (dev defaults — override with env vars) ---
# DB_URL defaults to local MySQL; override by setting the env var.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lpg_chain?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# DB_USERNAME defaults to root for local dev; override if different.
spring.datasource.username=${DB_USERNAME:root}

# DB_PASSWORD has NO default — must be set in the environment.
# Example (PowerShell): $env:DB_PASSWORD="your_password"
# Example (.env file):  DB_PASSWORD=your_password
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate (verbose for development) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging (verbose for development) ---
logging.level.com.lpgchain=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# --- Official Email Policy Configuration ---
lpgchain.email.distributor-domains=${LPGCHAIN_DISTRIBUTOR_EMAIL_DOMAINS:distributor.example,agency.example,approved-distributor.example,lpgchain.demo}
lpgchain.email.admin-domains=${LPGCHAIN_ADMIN_EMAIL_DOMAINS:lpgchain.example,admin.lpgchain.example,lpgchain.demo}

# --- Traccar GPS Integration Configuration ---
traccar.base-url=${TRACCAR_BASE_URL:http://localhost:8082}
traccar.connect-timeout-millis=${TRACCAR_CONNECT_TIMEOUT:3000}
traccar.read-timeout-millis=${TRACCAR_READ_TIMEOUT:3000}
traccar.api-token=${TRACCAR_API_TOKEN:}

# --- Redis Development Configuration ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
lpgchain.redis.latest-location-ttl-seconds=${REDIS_LATEST_LOCATION_TTL_SECONDS:60}
lpgchain.redis.tracking-channel=${REDIS_TRACKING_CHANNEL:lpgchain:tracking:vehicle-location}
lpgchain.redis.listener-auto-startup=${REDIS_LISTENER_AUTO_STARTUP:true}
lpgchain.redis.instance-id=${INSTANCE_ID:lpg-chain-1}


